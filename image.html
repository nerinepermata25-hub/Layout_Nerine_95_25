<!DOCTYPE html>
<html>
    <head>
        <title>Image HTML dan CSS</title>
        <link rel="stylesheet" href="image.css">
    </head>
    <body>
        <!--Cara menambahkan Gambar dengan ukuran normal-->
        <p>Ini adalah gambar dengan ukuran normal</p>
        <img src="minnie.jpg" alt="minnie mouse">
         <!--Cara mengubah ukuran pada gambar-->
        <p>Ini adalah gambar yang sudah diberi ukuran</p>
        <img src="minnie.jpg" alt="minnie mouse" class="ukuran">
         <!--Cara memberi lengkungan ukuran pada gambar-->
        <p>Ini adalah gambar yang sudah diberi lengkungan</p>
        <img src="minnie.jpg" alt="minnie mouse" class="lengkungan">
        <!--cara menggabungkan gambar dan teks-->
        <div class="kelompok">
            <img src="minnie.jpg" alt="minnie mouse">
            <p>gambar minnie mouse</p>
        </div>
        <!--cara memberi efek hover-->
        <div class="efek">
            <img src="minnie.jpg" alt="minnie mouse">
            <p>ini contoh hover</p>
        </div>
        <!-- ini font external-->
         <p class="external"> ini font external</p>
    </body>
</html>
